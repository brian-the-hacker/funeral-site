<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin | Makueni Pamoja</title>
<link rel="stylesheet" href="../css/styles.css">
<style>.row{display:flex;gap:1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}.row img{width:72px;height:54px;object-fit:cover;border-radius:4px}.row span{flex:1;word-break:break-word}.msg{padding:1rem 0;border-bottom:1px solid var(--line)}.msg small{color:var(--muted)}</style>
</head><body><main class="wrap" style="padding:2rem 0">
<h1>Site admin</h1><p id="status" role="status"></p>
<section id="login" style="padding:1rem 0"><form id="login-form"><h2>Log in</h2>
<label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn green">Log in</button></form></section>
<div id="panel" hidden>
<p><button class="btn green" id="logout">Log out</button></p>
<section style="padding:1.5rem 0"><h2>Add a photo or video</h2><form id="upload-form">
<label>File<input name="file" type="file" accept="image/*,video/*" required></label>
<label>Caption (optional)<input name="caption" maxlength="200"></label>
<button class="btn green">Upload</button></form></section>
<section style="padding:1.5rem 0"><h2>Gallery</h2><div id="items"></div></section>
<section style="padding:1.5rem 0"><h2>Messages from the contact form</h2><div id="msgs"></div></section>
</div></main>
<script src="../js/config.js"></script>
<script>
const API = SITE.api, $ = id => document.getElementById(id);
let token = sessionStorage.getItem("tk") || "";
const say = (t, bad) => { $("status").textContent = t; $("status").style.color = bad ? "#a02020" : "#1f6b3a"; };
const call = async (path, opt = {}) => {
  opt.headers = { ...(opt.headers || {}), Authorization: "Bearer " + token };
  const r = await fetch(API + path, opt);
  if (r.status === 401) { logout(); throw new Error("Please log in again."); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Something went wrong.");
  return r.status === 204 ? null : r.json();
};
const show = on => { $("login").hidden = on; $("panel").hidden = !on; if (on) load(); };
const logout = () => { token = ""; sessionStorage.removeItem("tk"); show(false); };
$("logout").onclick = logout;
$("login-form").onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await fetch(API + "/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    if (!r.ok) throw new Error("Wrong username or password.");
    token = (await r.json()).access_token; sessionStorage.setItem("tk", token); say(""); show(true);
  } catch (err) { say(err.message, true); }
};
$("upload-form").onsubmit = async e => {
  e.preventDefault(); say("Uploading…");
  try { await call("/api/gallery", { method: "POST", body: new FormData(e.target) }); e.target.reset(); say("Uploaded."); load(); }
  catch (err) { say(err.message, true); }
};
async function load() {
  try {
    const items = await (await fetch(API + "/api/gallery")).json();
    $("items").replaceChildren(...items.map(it => {
      const row = document.createElement("div"); row.className = "row";
      const m = document.createElement(it.resource_type === "video" ? "span" : "img");
      if (it.resource_type === "video") m.textContent = "Video"; else m.src = it.url.replace("/upload/", "/upload/w_150,f_auto,q_auto/");
      const cap = document.createElement("span"); cap.textContent = it.caption || "(no caption)";
      const del = document.createElement("button"); del.className = "btn green"; del.textContent = "Delete";
      del.onclick = async () => { if (!confirm("Delete this item permanently?")) return;
        try { await call("/api/gallery/" + it.id, { method: "DELETE" }); say("Deleted."); load(); } catch (err) { say(err.message, true); } };
      row.append(m, cap, del); return row;
    }));
    const msgs = await call("/api/contact");
    $("msgs").replaceChildren(...(msgs.length ? msgs : [{ empty: 1 }]).map(m => {
      const d = document.createElement("div"); d.className = "msg";
      if (m.empty) { d.textContent = "No messages yet."; return d; }
      const h = document.createElement("strong"); h.textContent = m.subject;
      const s = document.createElement("small"); s.textContent = ` ${m.name} · ${m.email} ${m.phone} · ${new Date(m.created_at).toLocaleString()}`;
      const p = document.createElement("p"); p.textContent = m.message;
      d.append(h, s, p); return d;
    }));
  } catch (err) { say(err.message, true); }
}
if (token) show(true);
</script></body></html>
